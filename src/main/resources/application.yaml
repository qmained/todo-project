spring:
  application:
    name: todo-project
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/todo
    username: postgres
    password: root
    pool:
      initial-size: 32
      max-size: 128
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    redis:
      time-to-live: 60000
  threads:
    virtual:
      enabled: true
